
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kyle Beland's | Killa Bees Hockey Co. | ITIS3135 | Survey</title>

    <link rel="icon" href="images/favicon.ico">
    <link rel="stylesheet" href="styles/default.css">

    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>
<body>
    <div data-include="components/header.html"></div>

    <main>
        <h2>Killa Bees Product Order Survey</h2>

        <p>Fill out the survey to select the Killa Bees merchandise you would like to order.</p>

        <form>
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <br><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <h3>Select Products</h3>

            <label>
                <input type="checkbox" name="product" value="Hockey Puck">
                Killa Bees Hockey Puck - $8.00
            </label>
            <br>

            <label>
                <input type="checkbox" name="product" value="Shirt">
                Killa Bees Shirt - $25.00
            </label>
            <br>

            <label>
                <input type="checkbox" name="product" value="Hat">
                Killa Bees Hat - $22.00
            </label>
            <br>

            <label>
                <input type="checkbox" name="product" value="Hoodie">
                Killa Bees Hoodie - $45.00
            </label>
            <br>

            <label>
                <input type="checkbox" name="product" value="UNCC Shirt">
                UNCC Hockey Collaboration Shirt - $30.00
            </label>
            <br>

            <label>
                <input type="checkbox" name="product" value="UNCC Hoodie">
                UNCC Hockey Collaboration Hoodie - $55.00
            </label>

            <br><br>

            <button type="button">Add Order</button>
        </form>
    </main>

    <div data-include="components/footer.html"></div>

    <script src="scripts/HTMLInclude.min.js"></script>
    <script src="https://divonbriesen.github.io/teaching/tools/standards-check.js" defer></script>
</body>
</html>
